# The gate defined in docs/COLLABORATION.md, run on every push and pull request.
#
# The inherited upstream suite (ci.yml) is disabled in this fork: it builds Docker
# images, the TUI and the WebUI across five runners, which costs minutes this fork
# does not need per commit. Re-enable it with `gh workflow enable "Test Suite"` when
# a change actually touches those areas.
#
# Runners are pinned to ubuntu-24.04 instead of ubuntu-latest: the label migrates to
# Ubuntu 26 in October 2026, and CI that can change operating system without a commit
# produces failures nobody can reproduce locally.

name: Fork gate

on:
  push:
    branches: [main]
    paths-ignore: &docs-only
      - "**/*.md"
      - docs/**
      - .agent/**
  pull_request:
    branches: [main]
    # Same filter as push, so a documentation-only pull request stays as quiet as a
    # documentation-only push. Use workflow_dispatch to force a run anyway.
    paths-ignore: *docs-only
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python:
    name: Python gate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest pytest-asyncio ruff

      - name: Lint
        run: python -m ruff check nanobot/qa

      - name: QA tests
        run: python -m pytest tests/qa -q

  webui:
    name: WebUI gate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: webui/package-lock.json

      - name: Install
        working-directory: webui
        run: npm ci --no-audit --no-fund

      - name: WebUI tests
        working-directory: webui
        run: npm test
